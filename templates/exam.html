<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎖️ Examen — GHOST</title>
<link rel="stylesheet" href="/static/style.css">
<style>
html,body{overflow:auto!important;height:auto!important;display:block!important;background:#050505;}
.ex-wrap{max-width:860px;margin:0 auto;padding:28px 20px 80px;}
.ex-header{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap;}

/* Setup panel */
.setup-panel{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:14px;padding:24px;}
.setup-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:18px;}
.setup-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.fi{background:#060606;border:1px solid #1e1e1e;border-radius:8px;color:#aaa;
  font-size:13px;padding:9px 12px;font-family:inherit;width:100%;}
.fi:focus{outline:none;border-color:#444;}

/* Exam mode */
#exam-mode{display:none;}
.ex-progress-bar-wrap{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:10px;
  padding:14px 18px;margin-bottom:16px;}
.ex-progress-track{background:#111;border-radius:4px;height:4px;margin-bottom:10px;}
.ex-progress-fill{background:var(--red);height:4px;border-radius:4px;transition:.3s;}
.ex-progress-meta{display:flex;justify-content:space-between;font-size:11px;color:#444;}
.ex-progress-meta .current{color:var(--red);font-weight:700;}

/* Question card */
.q-card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:16px;
  padding:28px;margin-bottom:14px;min-height:180px;}
.q-num{font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:10px;}
.q-text{font-size:18px;font-weight:600;color:#fff;line-height:1.5;margin-bottom:16px;}
.q-image{max-width:100%;max-height:360px;border-radius:10px;
  border:1px solid #1e1e1e;display:block;margin:0 auto 16px;}
.q-pts-badge{font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;
  border:1px solid #333;color:#555;display:inline-block;margin-bottom:14px;}

/* Answer buttons */
.ans-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.ans-btn{border-radius:12px;border:2px solid;padding:16px 32px;font-size:16px;
  font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;
  min-width:120px;background:transparent;}
.ans-btn.correct{border-color:#4ade80;color:#4ade80;}
.ans-btn.correct:hover,.ans-btn.correct.selected{background:#4ade8018;border-color:#4ade80;}
.ans-btn.partial{border-color:#fbbf24;color:#fbbf24;}
.ans-btn.partial:hover,.ans-btn.partial.selected{background:#fbbf2418;border-color:#fbbf24;}
.ans-btn.wrong{border-color:#ef4444;color:#ef4444;}
.ans-btn.wrong:hover,.ans-btn.wrong.selected{background:#ef444418;border-color:#ef4444;}
.ans-btn.selected{transform:scale(1.03);}

/* Navigation */
.ex-nav{display:flex;align-items:center;gap:10px;justify-content:space-between;}
.q-nav-dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1;}
.q-dot{width:10px;height:10px;border-radius:50%;background:#111;
  border:1px solid #222;cursor:pointer;transition:.2s;flex-shrink:0;}
.q-dot.answered-correct{background:#4ade80;border-color:#4ade80;}
.q-dot.answered-partial{background:#fbbf24;border-color:#fbbf24;}
.q-dot.answered-wrong{background:#ef4444;border-color:#ef4444;}
.q-dot.current{border-color:var(--red);box-shadow:0 0 6px var(--red);}

/* Answer model */
.q-answer-reveal{background:#060606;border:1px solid #1a1a1a;border-radius:10px;
  padding:12px 16px;margin-bottom:14px;display:none;}
.q-answer-reveal.visible{display:block;}
.q-answer-reveal-label{font-size:10px;color:#444;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.q-answer-reveal-text{font-size:13px;color:#888;}

/* Score live */
.score-live{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:10px;
  padding:10px 16px;display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
.score-live-val{font-size:26px;font-weight:800;color:var(--red);}
.score-live-total{font-size:13px;color:#444;}
.score-pct{font-size:13px;color:#666;}
.score-verdict{font-size:18px;}

/* Résultats finaux */
.results-panel{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:16px;
  padding:28px;text-align:center;display:none;}
.results-panel.visible{display:block;}
.results-score-big{font-size:52px;font-weight:900;color:var(--red);line-height:1;}
.results-label{font-size:14px;color:#444;margin-top:4px;}
.results-verdict{font-size:28px;margin:16px 0;}
.results-pct{font-size:18px;color:#888;}
.results-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:20px 0;}
.results-stat{background:#111;border-radius:10px;padding:12px;text-align:center;}
.results-stat-val{font-size:20px;font-weight:700;}
.results-stat-lbl{font-size:10px;color:#444;margin-top:2px;}
</style>
</head>
<body>
<div class="ex-wrap">

  <!-- Header -->
  <div class="ex-header">
    <a href="/" style="color:#444;text-decoration:none;font-size:13px">← Dashboard</a>
    <span style="font-size:22px;font-weight:800;color:#fff">🎖️ Passage de grade</span>
    <a href="/bank" style="color:#555;text-decoration:none;font-size:12px;margin-left:auto">🗂️ Banque de questions</a>
  </div>

  <!-- Setup -->
  <div id="setup-mode">
    <div class="setup-panel">
      <div class="setup-title">Configuration de l'examen</div>
      <div class="setup-row">
        <div>
          <label style="font-size:11px;color:#444;display:block;margin-bottom:5px">Ghost</label>
          <select class="fi" id="setup-ghost">
            <option value="">— Sélectionner un Ghost —</option>
            {% for s in students %}
            <option value="{{ loop.index0 }}">{{ s._rank.emoji }} {{ s.name or '?' }} · {{ '🎖️' if s._rank.branch=='marine' else '🏴‍☠️' }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label style="font-size:11px;color:#444;display:block;margin-bottom:5px">Grade visé</label>
          <select class="fi" id="setup-grade" onchange="onGradeChange()">
            <option value="">— Sélectionner un grade —</option>
            {% for r in ranks_pirates %}
            <option value="{{ r.emoji }}_{{ r.title }}_{{ r.idx }}" style="color:{{ r.color }}">
              {{ r.emoji }} {{ r.title }} (Pirates)
            </option>
            {% endfor %}
            {% for r in ranks_marine %}
            <option value="{{ r.emoji }}_{{ r.title }}_{{ r.idx }}" style="color:{{ r.color }}">
              {{ r.emoji }} {{ r.title }} (Marine)
            </option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div id="setup-preview" style="display:none;margin-bottom:14px">
        <div style="background:#060606;border:1px solid #111;border-radius:8px;padding:12px 14px">
          <div style="font-size:11px;color:#444;margin-bottom:6px">Aperçu de l'examen</div>
          <div id="setup-preview-text" style="font-size:13px;color:#888"></div>
        </div>
      </div>

      <div id="setup-no-questions" style="display:none;margin-bottom:14px">
        <div style="background:#060606;border:1px solid #cc1a1a33;border-radius:8px;padding:12px 14px">
          <span style="font-size:13px;color:#cc1a1a">⚠️ Aucune question dans la banque pour ce grade.</span>
          <a href="/bank" style="color:#888;font-size:12px;margin-left:8px;text-decoration:underline">→ Ajouter des questions</a>
        </div>
      </div>

      <button class="btn btn-red" id="start-btn" onclick="startExam()" disabled
        style="font-size:14px;padding:12px 28px;width:100%">
        ▶ Démarrer l'examen
      </button>
    </div>
  </div>

  <!-- Exam en cours -->
  <div id="exam-mode">

    <!-- Barre de progression -->
    <div class="ex-progress-bar-wrap">
      <div class="ex-progress-track">
        <div class="ex-progress-fill" id="progress-fill"></div>
      </div>
      <div class="ex-progress-meta">
        <span>Question <span class="current" id="q-counter">1</span> / <span id="q-total">—</span></span>
        <span id="ghost-name-badge" style="color:#888"></span>
        <span id="grade-badge" style="color:#888"></span>
      </div>
    </div>

    <!-- Score live -->
    <div class="score-live">
      <div>
        <span class="score-live-val" id="score-val">0</span>
        <span class="score-live-total"> / <span id="score-total">0</span> pts</span>
      </div>
      <div class="score-pct" id="score-pct">0%</div>
      <div class="score-verdict" id="score-verdict"></div>
      <div style="margin-left:auto">
        <button class="btn btn-ghost" style="font-size:12px" onclick="endExam()">🏁 Terminer</button>
      </div>
    </div>

    <!-- Question -->
    <div class="q-card" id="q-card">
      <div class="q-num" id="q-num"></div>
      <div class="q-pts-badge" id="q-pts-badge"></div>
      <div class="q-text" id="q-text"></div>
      <img class="q-image" id="q-image" src="" style="display:none"
        onerror="this.style.display='none'">
      <div class="ans-buttons">
        <button class="ans-btn correct"  id="btn-correct"  onclick="answer(1)">✅ Juste</button>
        <button class="ans-btn partial"  id="btn-partial"  onclick="answer(0.5)">½ Partiel</button>
        <button class="ans-btn wrong"    id="btn-wrong"    onclick="answer(0)">❌ Faux</button>
      </div>
    </div>

    <!-- Réponse modèle -->
    <div class="q-answer-reveal" id="answer-reveal">
      <div class="q-answer-reveal-label">Réponse modèle</div>
      <div class="q-answer-reveal-text" id="answer-reveal-text"></div>
    </div>

    <!-- Navigation dots -->
    <div class="ex-nav">
      <button class="btn btn-ghost" style="font-size:13px" onclick="prevQ()" id="btn-prev">← Préc.</button>
      <div class="q-nav-dots" id="nav-dots"></div>
      <button class="btn btn-red"   style="font-size:13px" onclick="nextQ()" id="btn-next">Suiv. →</button>
    </div>

    <div style="text-align:center;margin-top:14px">
      <textarea class="fi" id="exam-notes" rows="2"
        placeholder="Notes sur cet examen (optionnel)…"
        style="max-width:600px;resize:vertical"></textarea>
    </div>
  </div>

  <!-- Résultats -->
  <div class="results-panel" id="results-panel">
    <div class="results-score-big" id="res-score"></div>
    <div class="results-label">points sur <span id="res-total"></span></div>
    <div class="results-pct" id="res-pct"></div>
    <div class="results-verdict" id="res-verdict"></div>
    <div class="results-grid">
      <div class="results-stat">
        <div class="results-stat-val" style="color:#4ade80" id="res-correct">0</div>
        <div class="results-stat-lbl">Justes</div>
      </div>
      <div class="results-stat">
        <div class="results-stat-val" style="color:#fbbf24" id="res-partial">0</div>
        <div class="results-stat-lbl">Partiels</div>
      </div>
      <div class="results-stat">
        <div class="results-stat-val" style="color:#ef4444" id="res-wrong">0</div>
        <div class="results-stat-lbl">Faux</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;">
      <button class="btn btn-red" onclick="saveAndReset()" id="save-result-btn"
        style="font-size:14px;padding:12px 24px">💾 Sauvegarder le résultat</button>
      <button class="btn btn-ghost" onclick="resetAll()"
        style="font-size:13px">↺ Nouvel examen</button>
    </div>
    <div id="save-result-msg" style="font-size:12px;color:#555;margin-top:10px"></div>
  </div>

</div>

<script>
const STUDENTS  = {{ students|tojson }};
const EXAM_BANK = {{ exam_bank|tojson }};

var currentGradeKey   = '';
var currentGradeLabel = '';
var currentGhostIdx   = null;
var questions = [];
var answers   = {}; // {qIdx: 0|0.5|1}
var qIdx      = 0;

// ── Setup ──────────────────────────────────────────────────────────
function gradeKeyFromValue(val){
  // val = "emoji_title_idx" → reconstruit la clé banque
  // On cherche dans EXAM_BANK
  if(!val) return '';
  var parts = val.split('_');
  // Cherche d'abord match exact titre (retire emoji et idx)
  for(var k in EXAM_BANK){
    if(EXAM_BANK[k].grade_key === k) {
      // compare label
      if(EXAM_BANK[k].grade_label && val.includes(EXAM_BANK[k].grade_label.replace(/\s/g,''))) return k;
    }
  }
  // Fallback : cherche par titre brut
  for(var k in EXAM_BANK){
    if(val.toLowerCase().includes(k.toLowerCase())) return k;
  }
  return '';
}

document.getElementById('setup-ghost').onchange = function(){ checkSetup(); };

function onGradeChange(){
  var sel    = document.getElementById('setup-grade');
  var optTxt = sel.options[sel.selectedIndex].text.trim();
  // Cherche la banque par label correspondant
  currentGradeKey   = '';
  currentGradeLabel = '';
  for(var k in EXAM_BANK){
    var label = (EXAM_BANK[k].grade_label||'').replace(/\s+/g,' ').trim();
    if(optTxt.startsWith(label)){
      currentGradeKey   = k;
      currentGradeLabel = label;
      break;
    }
  }
  // Si pas trouvé, utilise le texte de l'option comme clé
  if(!currentGradeKey){
    currentGradeKey   = sel.value;
    currentGradeLabel = optTxt.replace(/\s*\(.*\)$/,'').trim();
  }
  checkSetup();
}

function checkSetup(){
  var ghostSel = document.getElementById('setup-ghost').value;
  var gradeSel = document.getElementById('setup-grade').value;
  var startBtn = document.getElementById('start-btn');
  var preview  = document.getElementById('setup-preview');
  var noQ      = document.getElementById('setup-no-questions');

  if(!ghostSel || !gradeSel){ startBtn.disabled=true; preview.style.display='none'; noQ.style.display='none'; return; }

  var bank = EXAM_BANK[currentGradeKey];
  var qs   = (bank && bank.questions) ? bank.questions : [];
  if(!qs.length){
    startBtn.disabled=true;
    preview.style.display='none';
    noQ.style.display='';
    return;
  }
  noQ.style.display='none';
  preview.style.display='';
  var total = qs.reduce(function(s,q){return s+(parseFloat(q.points)||1);},0);
  var imgs  = qs.filter(function(q){return !!q.image;}).length;
  document.getElementById('setup-preview-text').innerHTML =
    '<b style="color:#ccc">'+qs.length+'</b> question'+(qs.length>1?'s':'')+
    ' · <b style="color:#ccc">'+total.toFixed(1).replace(/\.0$/,'')+'</b> pts · '+
    (imgs>0?'<span style="color:#888">🖼️ '+imgs+' image'+(imgs>1?'s':'')+'</span> · ':'')+
    '<span style="color:#888">Seuil réussite : 60%</span>';
  startBtn.disabled = false;
}

function startExam(){
  var ghostSel = document.getElementById('setup-ghost');
  currentGhostIdx = parseInt(ghostSel.value);
  var bank = EXAM_BANK[currentGradeKey];
  questions = JSON.parse(JSON.stringify((bank && bank.questions)||[]));
  answers = {}; qIdx = 0;

  document.getElementById('setup-mode').style.display='none';
  document.getElementById('exam-mode').style.display='';
  document.getElementById('results-panel').style.display='none';
  document.getElementById('results-panel').classList.remove('visible');

  var ghostName = STUDENTS[currentGhostIdx] ? (STUDENTS[currentGhostIdx].name||'?') : '?';
  document.getElementById('ghost-name-badge').textContent = ghostName;
  document.getElementById('grade-badge').textContent = currentGradeLabel;
  document.getElementById('q-total').textContent = questions.length;

  renderQ();
  updateScore();
  renderDots();
}

// ── Question ───────────────────────────────────────────────────────
function renderQ(){
  var q = questions[qIdx];
  if(!q) return;
  document.getElementById('q-num').textContent = 'Question '+(qIdx+1)+' / '+questions.length;
  document.getElementById('q-pts-badge').textContent = (parseFloat(q.points)||1)+' pt'+(parseFloat(q.points)>1?'s':'');
  document.getElementById('q-text').textContent = q.question || '';
  document.getElementById('q-counter').textContent = qIdx+1;

  var img = document.getElementById('q-image');
  if(q.image){ img.src=q.image; img.style.display=''; }
  else { img.src=''; img.style.display='none'; }

  // Réponse modèle
  var reveal = document.getElementById('answer-reveal');
  if(q.answer && answers[qIdx]!==undefined){
    document.getElementById('answer-reveal-text').textContent = q.answer;
    reveal.classList.add('visible');
  } else {
    reveal.classList.remove('visible');
  }

  // Boutons
  ['btn-correct','btn-partial','btn-wrong'].forEach(function(id){
    document.getElementById(id).classList.remove('selected');
  });
  var val = answers[qIdx];
  if(val===1)   document.getElementById('btn-correct').classList.add('selected');
  if(val===0.5) document.getElementById('btn-partial').classList.add('selected');
  if(val===0)   document.getElementById('btn-wrong').classList.add('selected');

  // Progress
  var pct = ((qIdx)/(questions.length))*100;
  document.getElementById('progress-fill').style.width = pct+'%';

  // Nav
  document.getElementById('btn-prev').disabled = qIdx===0;
  document.getElementById('btn-next').textContent = qIdx===questions.length-1 ? '🏁 Voir résultats' : 'Suiv. →';

  renderDots();
}

function answer(val){
  answers[qIdx] = val;
  // Afficher réponse modèle si elle existe
  var q = questions[qIdx];
  if(q && q.answer){
    document.getElementById('answer-reveal-text').textContent = q.answer;
    document.getElementById('answer-reveal').classList.add('visible');
  }
  // Highlight bouton
  ['btn-correct','btn-partial','btn-wrong'].forEach(function(id){
    document.getElementById(id).classList.remove('selected');
  });
  var ids = {1:'btn-correct',0.5:'btn-partial',0:'btn-wrong'};
  if(ids[val]) document.getElementById(ids[val]).classList.add('selected');
  updateScore();
  renderDots();
  // Auto-avance après 400ms
  setTimeout(function(){
    if(qIdx < questions.length-1) nextQ();
    else updateScore();
  }, 500);
}

function nextQ(){
  if(qIdx < questions.length-1){ qIdx++; renderQ(); }
  else endExam();
}
function prevQ(){
  if(qIdx > 0){ qIdx--; renderQ(); }
}

function renderDots(){
  var wrap = document.getElementById('nav-dots');
  wrap.innerHTML='';
  questions.forEach(function(q,i){
    var dot = document.createElement('div');
    dot.className = 'q-dot';
    if(i===qIdx) dot.classList.add('current');
    var val = answers[i];
    if(val===1)   dot.classList.add('answered-correct');
    if(val===0.5) dot.classList.add('answered-partial');
    if(val===0)   dot.classList.add('answered-wrong');
    dot.onclick = function(){ qIdx=i; renderQ(); };
    dot.title = 'Q'+(i+1);
    wrap.appendChild(dot);
  });
}

function updateScore(){
  var total  = questions.reduce(function(s,q){return s+(parseFloat(q.points)||1);},0);
  var score  = 0;
  Object.keys(answers).forEach(function(i){
    score += (answers[i]||0) * (parseFloat(questions[parseInt(i)].points)||1);
  });
  var pct = total>0 ? Math.round(score/total*100) : 0;
  var answered = Object.keys(answers).length;

  document.getElementById('score-val').textContent   = score % 1===0 ? score : score.toFixed(1);
  document.getElementById('score-total').textContent = total % 1===0 ? total : total.toFixed(1);
  document.getElementById('score-pct').textContent   = pct+'%';

  var verdict = '';
  if(answered === questions.length){
    verdict = pct>=60 ? '🎉 Réussi !' : '❌ Échoué';
  }
  document.getElementById('score-verdict').textContent = verdict;
  document.getElementById('progress-fill').style.width = (answered/questions.length*100)+'%';
}

// ── Fin / Résultats ───────────────────────────────────────────────
function endExam(){
  document.getElementById('exam-mode').style.display='none';
  var results = document.getElementById('results-panel');
  results.style.display='block';
  results.classList.add('visible');

  var total  = questions.reduce(function(s,q){return s+(parseFloat(q.points)||1);},0);
  var score  = 0;
  var correct=0, partial=0, wrong=0, unanswered=0;
  questions.forEach(function(q,i){
    var val = answers[i];
    if(val===undefined){ unanswered++; }
    else {
      score += val*(parseFloat(q.points)||1);
      if(val===1) correct++;
      else if(val===0.5) partial++;
      else wrong++;
    }
  });
  var pct    = total>0 ? Math.round(score/total*100) : 0;
  var passed = pct >= 60;

  document.getElementById('res-score').textContent   = score%1===0?score:score.toFixed(1);
  document.getElementById('res-total').textContent   = total%1===0?total:total.toFixed(1);
  document.getElementById('res-pct').textContent     = pct+'% · Seuil : 60%';
  document.getElementById('res-verdict').textContent = passed ? '🎉 Examen réussi !' : '❌ Examen non validé';
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-partial').textContent = partial;
  document.getElementById('res-wrong').textContent   = wrong + (unanswered?' (+'+unanswered+' sans rép.)':'');

  // Stocker pour save
  window._examResult = {passed,score,total,pct,correct,partial,wrong};
}

function saveAndReset(){
  var btn = document.getElementById('save-result-btn');
  btn.disabled=true; btn.textContent='⏳…';
  var r = window._examResult;
  var ghost = STUDENTS[currentGhostIdx];
  var payload = {
    student_index: currentGhostIdx,
    grade_key:   currentGradeKey,
    grade_label: currentGradeLabel,
    score:  r.score,
    total:  r.total,
    passed: r.passed,
    notes:  document.getElementById('exam-notes').value.trim(),
  };
  fetch('/api/students/exam_result',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  }).then(function(r){return r.json();}).then(function(d){
    btn.disabled=false; btn.textContent='💾 Sauvegarder le résultat';
    if(d.ok){
      document.getElementById('save-result-msg').innerHTML =
        '✅ Résultat sauvegardé dans la fiche de <b>'+(ghost?ghost.name:'?')+'</b>';
    } else {
      document.getElementById('save-result-msg').textContent = '❌ Erreur lors de la sauvegarde';
    }
  });
}

function resetAll(){
  document.getElementById('results-panel').style.display='none';
  document.getElementById('results-panel').classList.remove('visible');
  document.getElementById('setup-mode').style.display='';
